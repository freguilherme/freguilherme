@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{background:var(--panel);border:1px solid var(--rule);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.12)}
.card{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:16px;max-width:min(400px,calc(100% - 32px));padding:12px 16px 12px;display:grid;gap:4px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-stretch:85%;font-weight:800;font-size:clamp(22px,3.4vw,32px);line-height:1.05;margin:0;text-wrap:balance}
.meta{margin:2px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.dock{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);margin-inline:auto;max-width:1040px;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.views{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.views button{font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink);background:var(--chip);border:1px solid var(--rule);padding:6px 11px;cursor:pointer}
.views button:hover{border-color:var(--accent)}
.views button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sun{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.sun input{accent-color:var(--accent);width:150px}
.sun output{color:var(--ink);font-variant-numeric:tabular-nums;min-width:3.2em}
.toggles{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer}
.toggles input{accent-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
#msg{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:13px;color:var(--muted);padding:16px;text-align:center;pointer-events:none}
@media (max-width:640px){

// ---------- Utilidades ----------
let seed = 20261011;
const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a,b) => a + (b-a)*rnd();
const L = H.lot, FL = .1, WH = FL + H.H, CX = L.w/2, CZ = -L.d/2;

// ---------- Renderer, cena, câmera ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd8d6cf, 70, 230);
const camera = new THREE.PerspectiveCamera(42, 1, .1, 3000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI/2 - .02; controls.minDistance = 1.2; controls.maxDistance = 130;

const world = new THREE.Group(); world.name = 'Casa'; scene.add(world);

// ---------- Texturas procedurais (UVs em metros; repeat = 1 / tamanho do ladrilho) ----------
function canvasTex(px, tile, draw, srgb = true, h = px){
  const c = document.createElement('canvas'); c.width = px; c.height = h;
  const g = c.getContext('2d'); draw(g, px, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1/tile, 1/tile); t.anisotropy = 8;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function speckle(g, w, h, n, colors, smin, smax, alpha = 1){
  for (let i = 0; i < n; i++){ g.globalAlpha = alpha*R(.25,1); g.fillStyle = colors[(rnd()*colors.length)|0]; const s = R(smin,smax); g.fillRect(rnd()*w, rnd()*h, s, s); }
  g.globalAlpha = 1;
}
const hsl = (h,s,l) => `hsl(${h},${s}%,${l}%)`;

  woodFloor: canvasTex(512, 2.4, (g,p)=>{

      g.fillStyle = 'rgba(40,24,12,.55)'; g.fillRect(i*cw, y, cw, 1.2); y += len; }
      g.fillStyle = 'rgba(40,24,12,.5)'; g.fillRect(i*cw, 0, 1.2, p); }

      for (let k = 0; k < 6; k++){ g.strokeStyle = `rgba(30,12,4,${R(.08,.2)})`; g.lineWidth = R(.6,1.6); const yy = j*rh + R(2,rh-2); g.beginPath(); g.moveTo(x, yy); g.lineTo(x+len, yy+R(-2,2)); g.stroke(); }
      g.fillStyle = 'rgba(20,10,4,.7)'; g.fillRect(x, j*rh, 1.5, rh); x += len; }
      g.fillStyle = 'rgba(15,8,3,.85)'; g.fillRect(0, j*rh, p, 3); } }),
  grass: canvasTex(512, 1.6, (g,p)=>{ g.fillStyle = '#5E7A40'; g.fillRect(0,0,p,p); speckle(g,p,p,70000,['#53703A','#6C8A4A','#7C9856','#46622F','#8C9F5E','#6F7F45'],1,2.4,.9); }),

  mosaic: canvasTex(256, .5, (g,p)=>{ const n = 10, s = p/n; g.fillStyle = '#EAF4F4'; g.fillRect(0,0,p,p);

function meterUV(geo, w, h, d){
  const uv = geo.attributes.uv, dims = [[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for (let f = 0; f < 6; f++) for (let k = 0; k < 4; k++){ const i = f*4+k; uv.setXY(i, uv.getX(i)*dims[f][0], uv.getY(i)*dims[f][1]); }
}
function box(w, h, d, x, y, z0, m, parent = world, cast = true){
  const g = new THREE.BoxGeometry(w, h, d); meterUV(g, w, h, d);
  const o = new THREE.Mesh(g, m); o.position.set(x+w/2, z0+h/2, -(y+d/2)); o.castShadow = cast; o.receiveShadow = true; parent.add(o); return o;
}
function slab(x, y, w, d, z0, th, m, parent = world, holes = []){
  const s = new THREE.Shape(); s.moveTo(x,y); s.lineTo(x+w,y); s.lineTo(x+w,y+d); s.lineTo(x,y+d); s.closePath();
  holes.forEach(h=>{ const p = new THREE.Path(); p.moveTo(h.x,h.y); p.lineTo(h.x,h.y+h.d); p.lineTo(h.x+h.w,h.y+h.d); p.lineTo(h.x+h.w,h.y); p.closePath(); s.holes.push(p); });
  const g = new THREE.ExtrudeGeometry(s, {depth:th, bevelEnabled:false}); g.rotateX(-Math.PI/2); g.translate(0, z0, 0);
  const o = new THREE.Mesh(g, m); o.receiveShadow = true; o.castShadow = th > .06; parent.add(o); return o;
}
function lineBox(a, b, t, z0, h, m, parent = world){
  const hor = a[1] === b[1];
  return hor ? box(Math.abs(b[0]-a[0])+t, h, t, Math.min(a[0],b[0])-t/2, a[1]-t/2, z0, m, parent)
             : box(t, h, Math.abs(b[1]-a[1])+t, a[0]-t/2, Math.min(a[1],b[1])-t/2, z0, m, parent);
}

function frame(hor, k, u0, w, z0, h, t){
  const ft = .05, fd = Math.min(t, .1) + .02;
  const bar = (uu0, uw, zz0, zh) => hor ? box(uw, zh, fd, uu0, k-fd/2, zz0, mat.frame) : box(fd, zh, uw, k-fd/2, uu0, zz0, mat.frame);
  bar(u0, w, z0, ft); bar(u0, w, z0+h-ft, ft); bar(u0, ft, z0, h); bar(u0+w-ft, ft, z0, h);
  const n = Math.max(1, Math.round(w/1.1)); for (let i = 1; i < n; i++) bar(u0+w*i/n-ft/2, ft, z0, h);
}
H.walls.forEach(w => {
  const hor = w.a[1] === w.b[1], t = w.t, top = w.h ? .06+w.h : WH;
  const a0 = (hor ? w.a[0] : w.a[1]) - t/2, a1 = (hor ? w.b[0] : w.b[1]) + t/2, k = hor ? w.a[1] : w.a[0];
  const seg = (u0, u1, z0, z1) => { if (u1-u0 <= 0 || z1-z0 <= 0) return; hor ? box(u1-u0, z1-z0, t, u0, k-t/2, z0, mat.plaster) : box(t, z1-z0, u1-u0, k-t/2, u0, z0, mat.plaster); };
  const pane = (u0, pw, z0, ph, m = mat.glass, th = .02) => { const o = hor ? box(pw, ph, th, u0, k-th/2, z0, m) : box(th, ph, pw, k-th/2, u0, z0, m); if (m === mat.glass) o.castShadow = false; return o; };
  let cur = a0;
  [...w.o].sort((p,q)=>p.c-q.c).forEach(op => {
    const u0 = op.c-op.w/2, u1 = op.c+op.w/2; seg(cur, u0, 0, top); cur = u1;
    if (op.k === 'door'){
      seg(u0, u1, FL+2.1, top);
      if (op.main){ seg(u0, u1, FL+2.1, top); pane(u0, op.w, FL, 2.1, mat.slat, .06);
        hor ? box(.03, 1.2, .05, u1-.18, k-.09, FL+.5, mat.steelDark) : box(.05, 1.2, .03, k-.09, u1-.18, FL+.5, mat.steelDark); }
    } else if (op.k === 'open'){ seg(u0, u1, FL+2.4, top); }
    else if (op.k === 'slide'){ const zt = FL+2.4; seg(u0, u1, zt, top); pane(u0, op.w, FL, zt-FL); frame(hor, k, u0, op.w, FL, zt-FL, t); }
    else { const sill = FL+(op.sill ?? 1.0), zt = sill+(op.h ?? 1.2); seg(u0, u1, 0, sill); seg(u0, u1, zt, top); pane(u0, op.w, sill, zt-sill); frame(hor, k, u0, op.w, sill, zt-sill, t); }
  });
  seg(cur, a1, 0, top);
});

}

function car(f){
  const paint = new THREE.MeshPhysicalMaterial({color: f.c === 'car1' ? 0x2E3238 : 0xE4E4E1, metalness:.55, roughness:.32, clearcoat:1, clearcoatRoughness:.06});
  const g = new THREE.Group(); g.position.set(f.x+f.w/2, 0, -(f.y+f.d/2));
  const add = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x,y,z); o.castShadow = o.receiveShadow = true; g.add(o); return o; };
  add(new RoundedBoxGeometry(f.w, .66, f.d, 4, .17), paint, 0, .64, 0);
  const cg = new RoundedBoxGeometry(f.w-.14, .5, f.d*.52, 4, .16), cp = cg.attributes.position;
  for (let i = 0; i < cp.count; i++) if (cp.getY(i) > 0){ cp.setX(i, cp.getX(i)*.86); cp.setZ(i, cp.getZ(i)*.72 - .08); }
  cg.computeVertexNormals(); add(cg, mat.carGlass, 0, 1.1, -.2);
  add(new RoundedBoxGeometry(f.w*.78, .05, f.d*.34, 2, .02), paint, 0, 1.36, -.28);
  add(new RoundedBoxGeometry(f.w+.02, .14, f.d+.02, 2, .06), S({color:0x1d1f21, roughness:.6}), 0, .36, 0);
  const wg = new THREE.CylinderGeometry(.33, .33, .24, 24); wg.rotateZ(Math.PI/2);
  const rg = new THREE.CylinderGeometry(.2, .2, .25, 18); rg.rotateZ(Math.PI/2);
  for (const sx of [-1,1]) for (const sz of [-1,1]){ add(wg, mat.tire, sx*(f.w/2-.1), .33, sz*1.35); add(rg, mat.steel, sx*(f.w/2-.09), .33, sz*1.35); }
  const hl = new THREE.MeshStandardMaterial({color:0xffffff, emissive:0xfff3d6, emissiveIntensity:.4, roughness:.1});
  for (const sx of [-1,1]){ add(new THREE.BoxGeometry(.38,.08,.05), hl, sx*(f.w/2-.32), .78, f.d/2-.01); add(new THREE.BoxGeometry(.38,.07,.05), mat.red, sx*(f.w/2-.32), .82, -f.d/2+.01); }

}

    box(f.w, .3, f.d, f.x, f.y, base, mat.slat, furn); box(f.w-.06, .22, f.d-.1, f.x+.03, f.y+.05, base+.3, mat.fabricBed, furn);

    box(f.w-.2, .12, .35, f.x+.1, mx ? f.y+f.d-.43 : f.y+.08, base+.52, mat.white, furn);

    b === 'y1' ? box(f.w, .4, .18, f.x, f.y+f.d-.18, base+f.h, m, furn) : box(f.w, .4, .18, f.x, f.y, base+f.h, m, furn); return; }

  if (f.k === 'rug'){ box(f.w, .015, f.d, f.x, f.y, base, m, furn, false); return; }
  if (f.k === 'lounger'){ box(f.w, .12, f.d, f.x, f.y, .3, mat.white, furn); box(f.w, .08, .7, f.x, f.y+f.d-.6, .45, mat.white, furn).rotation.x = .5;
    [[.05,.1],[f.w-.1,.1],[.05,f.d-.2],[f.w-.1,f.d-.2]].forEach(([dx,dy]) => box(.05, .3, .05, f.x+dx, f.y+dy, .04, mat.steelDark, furn)); return; }
  if (f.k === 'grill'){ box(f.w, 1.0, f.d, f.x, f.y, base, mat.brick, furn); box(f.w, .6, f.d, f.x, f.y, base+1.0, mat.steelDark, furn); box(f.w*.6, 1.1, f.d*.6, f.x+f.w*.2, f.y+f.d*.2, base+1.6, mat.brick, furn); return; }
  if (f.k === 'dog'){ box(f.w, f.h*.65, f.d, f.x, f.y, base, m, furn);
    const r = new THREE.Mesh(new THREE.ConeGeometry(Math.max(f.w,f.d)*.75, f.h*.45, 4), mat.brick); r.rotation.y = Math.PI/4; r.position.set(f.x+f.w/2, base+f.h*.65+f.h*.225, -(f.y+f.d/2)); r.castShadow = true; furn.add(r);
    box(.35, .4, .03, f.x+f.w/2-.175, f.y-.02, base, mat.granite, furn); return; }
  box(f.w, f.h, f.d, f.x, f.y, base, m, furn);
});

{ const g = new THREE.Group(); g.position.set(5.8, 0, -21.4);

// ---------- Paisagismo ----------
const plants = new THREE.Group(); plants.name = 'Paisagismo'; world.add(plants);
function blob(r, sx = 1, sy = .85, ph = rnd()*10){
  const g = new THREE.SphereGeometry(r, 28, 18), p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++){ v.fromBufferAttribute(p, i); const n = 1 + .14*Math.sin(v.x*7/r+ph)*Math.sin(v.y*6/r+ph*1.3)*Math.cos(v.z*5/r+ph*.7) + .05*Math.sin(v.x*21/r+v.z*17/r+ph) + .03*Math.sin(v.y*31/r+v.x*27/r);
    p.setXYZ(i, v.x*n*sx, v.y*n*sy, v.z*n*sx); }
  g.computeVertexNormals(); return g;
}
const leafMat = () => mat.leaves[(rnd()*mat.leaves.length)|0];
function shrub(x, y, s = .5, parent = plants){
  const n = 3 + (rnd()*3|0);
  for (let i = 0; i < n; i++){ const r = s*R(.45,.7); const o = new THREE.Mesh(blob(r), leafMat()); o.position.set(x+R(-s,s)*.6, r*.75+R(0,s*.4), -(y+R(-s,s)*.6)); o.castShadow = o.receiveShadow = true; parent.add(o); }
}
function tree(x, y, h = 4.2, r = 1.6, parent = plants){
  const g = new THREE.Group(); g.position.set(x, 0, -y);
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.09, .16, h*.6, 10), mat.trunk); tr.position.y = h*.3; tr.castShadow = true; g.add(tr);
  for (let i = 0; i < 3; i++){ const b = new THREE.Mesh(new THREE.CylinderGeometry(.04, .07, h*.35, 6), mat.trunk); const a = i*2.1 + R(0,.6); b.position.set(Math.cos(a)*.25, h*.6, Math.sin(a)*.25); b.rotation.set(Math.sin(a)*.6, 0, -Math.cos(a)*.6); b.castShadow = true; g.add(b); }
  for (let i = 0; i < 9; i++){ const rr = r*R(.42,.62), a = rnd()*6.28, d = r*R(.1,.55); const o = new THREE.Mesh(blob(rr, 1, .75), leafMat()); o.position.set(Math.cos(a)*d, h*R(.68,.9), Math.sin(a)*d); o.castShadow = o.receiveShadow = true; g.add(o); }
  parent.add(g); return g;
}
function palm(x, y, h = 4, parent = plants){
  const g = new THREE.Group(); g.position.set(x, 0, -y);
  const n = 7, lean = new THREE.Vector3(R(-.06,.06), 1, R(-.06,.06)); let p = new THREE.Vector3();
  for (let i = 0; i < n; i++){ const sh = h/n, c = new THREE.Mesh(new THREE.CylinderGeometry(.11-i*.006, .13-i*.006, sh*1.02, 10), mat.palmTrunk);
    const q = p.clone().addScaledVector(lean, sh/2); c.position.copy(q); c.castShadow = true; g.add(c); p.addScaledVector(lean, sh);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(.13-i*.006, .015, 4, 12), mat.trunk); ring.rotation.x = Math.PI/2; ring.position.copy(p); g.add(ring); }
  const fg = new THREE.PlaneGeometry(.7, 2.0, 1, 10); fg.translate(0, 1.0, 0);
  const pos = fg.attributes.position; for (let i = 0; i < pos.count; i++){ const t = pos.getY(i)/2.0; pos.setZ(i, .9*t*t); } fg.computeVertexNormals();
  const nf = 11;
  for (let i = 0; i < nf; i++){ const piv = new THREE.Group(); piv.position.copy(p); piv.rotation.y = i/nf*Math.PI*2 + R(-.2,.2);
    const fr = new THREE.Mesh(fg, mat.frond); fr.rotation.x = R(.7,1.25); fr.castShadow = true; piv.add(fr); g.add(piv); }
  parent.add(g); return g;
}
function bromeliad(x, y, parent = plants){
  const g = new THREE.Group(); g.position.set(x, 0, -y);
  for (let i = 0; i < 12; i++){ const c = new THREE.Mesh(new THREE.ConeGeometry(.035, .38, 4), i % 3 ? leafMat() : mat.red); const a = i/12*6.28;
    c.position.set(Math.cos(a)*.08, .16, Math.sin(a)*.08); c.rotation.set(Math.sin(a)*.8, 0, -Math.cos(a)*.8); c.castShadow = true; g.add(c); }
  const core = new THREE.Mesh(new THREE.ConeGeometry(.05, .22, 6), mat.red); core.position.y = .12; g.add(core); parent.add(g);
}
// jardim da frente
tree(7.1, 2.4, 4.4, 1.7);
[[5.9,.6,.45],[8.1,.5,.4],[6.0,4.6,.5],[8.2,4.8,.55],[5.8,2.8,.35]].forEach(([x,y,s]) => shrub(x, y, s));

// ---------- Vizinhança ----------
const nb = new THREE.Group(); nb.name = 'Vizinhanca'; scene.add(nb);
function house(x, y, w, d, h = 3, roofType = 'hip', mi = 0){
  box(w, h, d, x, y, 0, mat.nbWall[mi % 4], nb);
  if (roofType === 'hip'){ const r = new THREE.Mesh(new THREE.ConeGeometry(1, 1.3, 4, 1), mat.roofTile); r.rotation.y = Math.PI/4; r.scale.set((w+.8)/Math.SQRT2, 1, (d+.8)/Math.SQRT2); r.position.set(x+w/2, h+.65, -(y+d/2)); r.castShadow = r.receiveShadow = true; nb.add(r); }
  else { slab(x-.1, y-.1, w+.2, d+.2, h, .12, mat.nbWall[mi % 4], nb); lineBox([x,y],[x+w,y],.15,h,.6,mat.nbWall[mi%4],nb); lineBox([x,y+d],[x+w,y+d],.15,h,.6,mat.nbWall[mi%4],nb); lineBox([x,y],[x,y+d],.15,h,.6,mat.nbWall[mi%4],nb); lineBox([x+w,y],[x+w,y+d],.15,h,.6,mat.nbWall[mi%4],nb); }
  for (let i = 0; i < Math.floor(w/2.4); i++) box(1.2, 1.1, .05, x+.7+i*2.4, y-.03, 1.0, mat.nbWin, nb, false);
  for (let i = 0; i < Math.floor(d/3); i++){ box(.05, 1.1, 1.2, x-.03, y+1+i*3, 1.0, mat.nbWin, nb, false); box(.05, 1.1, 1.2, x+w-.02, y+1+i*3, 1.0, mat.nbWin, nb, false); }
}

[[-7,-1],[13,-1],[22,-1],[-17,-1],[3,-11.2],[15,-11.2],[-9,-11.2],[26,-11.2]].forEach(([x,y]) => tree(x, y, R(4.5,6), R(1.6,2.1), nb));

// ---------- Céu e sol ----------
const sky = new Sky(); sky.scale.setScalar(1500); scene.add(sky);
const skyEnvScene = new THREE.Scene(), skyEnv = new Sky(); skyEnv.scale.setScalar(1000); skyEnvScene.add(skyEnv);
for (const s of [sky, skyEnv]){ const u = s.material.uniforms; u.turbidity.value = 5.5; u.rayleigh.value = 1.4; u.mieCoefficient.value = .004; u.mieDirectionalG.value = .82; }
const hemi = new THREE.HemisphereLight(0xdfe8f0, 0x6d6a5c, .35); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, {left:-24, right:24, top:24, bottom:-24, near:1, far:120}); sun.shadow.bias = -.0003; sun.shadow.normalBias = .02;
sun.target.position.set(CX, 0, CZ); scene.add(sun, sun.target);
const pmrem = new THREE.PMREMGenerator(renderer); let envRT = null;
const warm = new THREE.Color(0xffc58a), noon = new THREE.Color(0xfff6ec);
function setHour(t){
  const phi = Math.PI*(t-6)/12, e = Math.asin(Math.max(.03, Math.sin(phi))*.9), a = phi;
  // casa voltada para o norte: o sol cruza pela frente (rua) de leste a oeste
  const dir = new THREE.Vector3(Math.cos(a)*Math.cos(e), Math.sin(e), .55*Math.cos(e) + .1).normalize();
  for (const s of [sky, skyEnv]) s.material.uniforms.sunPosition.value.copy(dir);
  sun.position.copy(sun.target.position).addScaledVector(dir, 60);
  const k = THREE.MathUtils.clamp(e/.7, 0, 1);
  sun.color.copy(warm).lerp(noon, k); sun.intensity = 4.2*THREE.MathUtils.clamp(e/.2, .25, 1);
  hemi.intensity = .08 + .12*k;
  renderer.toneMappingExposure = .5 - .08*k;
  envRT?.dispose(); envRT = pmrem.fromScene(skyEnvScene); scene.environment = envRT.texture;
  const hh = Math.floor(t), mm = Math.round((t-hh)*60);
  document.getElementById('hourOut').textContent = `${hh}:${String(mm).padStart(2,'0')}`;
}
const hourEl = document.getElementById('hour');
hourEl.addEventListener('input', () => setHour(+hourEl.value));
setHour(+hourEl.value);
scene.traverse(o => { const ms = Array.isArray(o.material) ? o.material : o.material ? [o.material] : []; ms.forEach(m => { if (m.isMeshStandardMaterial && !m.userData.env){ m.userData.env = 1; m.envMapIntensity = (m.envMapIntensity ?? 1) * .45; } }); });

// ---------- Vistas ----------
const CAMS = {
  aerea:    {p:[CX+10, 21, 10],         t:[CX, 0, CZ+2]},
  rua:      {p:[CX+8.5, 1.65, 7.5],     t:[CX-1.5, 2.0, -3.5]},
  entrada:  {p:[CX+1.4, 1.6, 1.6],       t:[CX-.3, 1.8, -5.5]},
  fundos:   {p:[CX+6.5, 13, -L.d-8],    t:[CX, 0, -L.d+7]},
  piscina:  {p:[8.2, 1.6, -21.2],       t:[2.2, .1, -23.6]},
  interior: {p:[CX, 21, CZ+.4],         t:[CX, 0, CZ+.3], roof:false, nb:false},
};
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tween = null;
const optRoof = document.getElementById('opt-roof'), optFurn = document.getElementById('opt-furn'), optNb = document.getElementById('opt-nb');
const sync = () => { roof.visible = optRoof.checked; furn.visible = optFurn.checked; nb.visible = optNb.checked; };
[optRoof, optFurn, optNb].forEach(el => el.addEventListener('change', sync));
function view(name, instant = false){
  const c = CAMS[name]; if (!c) return;
  document.querySelectorAll('[data-cam]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cam === name));
  optRoof.checked = c.roof !== false; optNb.checked = c.nb !== false; sync();
  const p1 = new THREE.Vector3(...c.p), t1 = new THREE.Vector3(...c.t);
  if (instant || reduce){ camera.position.copy(p1); controls.target.copy(t1); controls.update(); tween = null; return; }
  tween = {p0:camera.position.clone(), t0:controls.target.clone(), p1, t1, s:performance.now(), d:1100};
}
document.querySelectorAll('[data-cam]').forEach(b => b.addEventListener('click', () => view(b.dataset.cam)));
let initial = 'aerea';
const hash = location.hash.slice(1); if (CAMS[hash]) initial = hash;

// ---------- Loop ----------
function resize(){ const w = app.clientWidth, h = app.clientHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w/h; camera.fov = w/h < .8 ? 58 : 42; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(app); resize();
const clock = new THREE.Clock(); let first = true;
function loop(){
  requestAnimationFrame(loop);
  if (document.hidden) return;
  const dt = clock.getDelta();
  if (!reduce){ tx.water.offset.x += dt*.02; tx.water.offset.y += dt*.013; }
  if (tween){ const k = Math.min(1, (performance.now()-tween.s)/tween.d), e = k < .5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e); if (k >= 1) tween = null; }
  controls.update(); renderer.render(scene, camera);
  if (first){ first = false; document.getElementById('msg').remove(); window.__ready = true; }
}
loop();

// usado para gerar as imagens e o arquivo .glb do repositório
window.casa3d = {
  view: n => view(n, true), cam: (p, t) => { camera.position.set(...p); controls.target.set(...t); controls.update(); }, setHour: t => { hourEl.value = t; setHour(t); },
  exportGLB: () => new Promise(res => new GLTFExporter().parse(world, r => {
    const b = new Uint8Array(r); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i+0x8000)); res(btoa(s));
  }, () => res(null), {binary:true})),
};
